spring.application.name=portail-edr

# En local, les variables sont lues dans le fichier .env (le meme que Docker Compose).
# Ailleurs (CI, serveur), elles viennent de l'environnement. Le fichier est optionnel.
spring.config.import=optional:file:.env[.properties]

# Base de donnees : jamais de valeur en dur, tout vient de l'environnement.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Le schema appartient a Flyway. Hibernate verifie seulement qu'il correspond aux entites.
spring.jpa.hibernate.ddl-auto=validate
# Pas de session JPA ouverte pendant le rendu des vues : les transactions restent dans les services.
spring.jpa.open-in-view=false

# Migrations SQL dans src/main/resources/db/migration, appliquees au demarrage.
spring.flyway.locations=classpath:db/migration

# Actuator : seul l'endpoint health est expose, sans details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Annuaire : lien vers la liste officielle des notaires (Chambre des notaires du Senegal).
# Vide par defaut : l'annuaire affiche alors un texte, sans lien.
portail.annuaire.lien-notaires=

# Pieces deposees (CNI, copie du titre foncier) : dossier HORS de l'application et de tout
# dossier servi par le web (voir StockagePieces). En production, UPLOAD_DIR pointe vers un volume.
portail.fichiers.dossier=${UPLOAD_DIR:donnees}
portail.fichiers.taille-max=5MB
# Limite du serveur, au-dessus de celle d'une piece : un fichier de 5 a 20 Mo recoit le message
# en francais du formulaire ; au-dela, la requete est refusee par le serveur lui-meme.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=64MB

# Code de verification SMS (choix du projet, pas une regle legale)
portail.sms.longueur-code=6
portail.sms.validite=5m
portail.sms.tentatives-max=3
portail.sms.delai-renvoi=60s
portail.sms.envois-max=3

# Suivi d'une demande (choix du projet)
# Une verification SMS reussie reste valable tant que la demande est consultee au moins toutes les 30 min.
portail.suivi.inactivite=30m
# Envois et essais de code comptes par reference, toutes sessions confondues, pendant cette duree.
portail.suivi.fenetre-limite=1h
# Le resultat paye se telecharge pendant 15 jours apres la date du paiement.
portail.suivi.duree-telechargement=15d
