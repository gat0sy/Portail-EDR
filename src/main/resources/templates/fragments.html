<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
    Fragments communs a toutes les pages : en-tete et pieds de page.
    Le prototype affichait ou masquait les blocs par role avec data-for / data-auth et proto.js.
    Ici le serveur decide (sec:authorize) : un bloc qui ne concerne pas l'utilisateur n'est pas envoye.
-->
<body>

    <header class="top" th:fragment="entete">

        <a class="logo" th:href="@{/}">
            <svg class="senegal-flag" viewBox="0 0 3 2" aria-label="Drapeau du Sénégal" role="img">
                <rect width="1" height="2" fill="#00853F"/>
                <rect x="1" width="1" height="2" fill="#FDEF42"/>
                <rect x="2" width="1" height="2" fill="#E31B23"/>
                <path d="M1.5 .55l.11.34h.36l-.29.21.11.35-.29-.22-.29.22.11-.35-.29-.21h.36z" fill="#00853F"/>
            </svg>

            <div class="logo-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 9h18L12 3 3 9Z"/>
                    <path d="M5 10v8M9 10v8M15 10v8M19 10v8"/>
                    <path d="M3 19h18M2 22h20"/>
                </svg>
            </div>

            <div>
                Portail EDR
                <small>État des droits réels</small>
            </div>
        </a>

        <div class="sp"></div>

        <a class="btn s sm connexion-btn" sec:authorize="isAnonymous()" th:href="@{/connexion}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/><path d="M10 12v2h4v-2"/></svg>
            Connexion
        </a>

        <details class="account" sec:authorize="isAuthenticated()">
            <summary>
                <span class="avatar" sec:authentication="principal.initiales">MF</span>
                <span class="who">[[${#authentication.principal.nom}]]<small sec:authentication="principal.roleLibelle">Notaire</small></span>
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </summary>
            <nav class="account-menu" aria-label="Compte">
                <a th:href="@{/profil}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Mon profil</a>
                <a sec:authorize="hasRole('NOTAIRE')" th:href="@{/demandes/nouvelle}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6"/><path d="M9 15h6"/></svg>Nouvelle demande</a>
                <a sec:authorize="hasRole('CONSERVATEUR')" th:href="@{/conservateur/demandes}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>Demandes du bureau</a>
                <a sec:authorize="hasRole('ADMINISTRATEUR')" th:href="@{/admin}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Administration</a>
                <form th:action="@{/deconnexion}" method="post">
                    <button class="out" type="submit"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Déconnexion</button>
                </form>
            </nav>
        </details>

    </header>

    <footer class="site-footer" th:fragment="pied">
        Portail EDR · État des droits réels
    </footer>

    <footer class="home-footer" th:fragment="pied-accueil">
        Portail EDR · État des droits réels
    </footer>

</body>
</html>
