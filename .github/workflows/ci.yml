# Compile et lance les tests (./mvnw verify) a chaque push et pull request.
# Les tests demarrent un PostgreSQL avec Testcontainers : Docker est deja
# disponible sur les runners ubuntu de GitHub.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw --batch-mode verify
